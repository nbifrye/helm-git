name: release

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'

      - run: npm ci

      - run: npm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm: ['2.17.0', '3.4.2', '3.7.1', '3.18.5', '4.0.5', '4.3.2']
    env:
      FIXTURES_GIT_REPO: ${{ format('{0}/{1}', github.server_url, github.event.pull_request.head.repo.full_name || github.repository) }}
      FIXTURES_GIT_REF: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'

      - uses: azure/setup-helm@v4
        with:
          version: ${{ matrix.helm }}
        id: helm

      - run: npm ci

      - name: Replace common utilities by busybox counterparts
        run: |
          path="${PWD}/.busybox"
          mkdir -p $path
          ln -fs /bin/busybox $path/sh
          ln -fs /bin/busybox $path/sed
          ln -fs /bin/busybox $path/grep
          ln -fs /bin/busybox $path/ls
          ln -fs /bin/busybox $path/mktemp
          echo "$path" >> $GITHUB_PATH

      - run: npm run test
      - run: npm run test:e2e

  package:
    name: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm: ['4.0.5', '4.3.2']
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v4
        with:
          version: ${{ matrix.helm }}

      - name: Package and sign with a throwaway key
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-gen-key 'helm-git CI <ci@example.invalid>' rsa4096 sign never
          gpg --batch --export-secret-keys > "$RUNNER_TEMP/secring.gpg"
          gpg --batch --export > "$RUNNER_TEMP/pubring.gpg"
          HELM_GIT_SIGNING_KEY='helm-git CI' HELM_GIT_SIGNING_KEYRING="$RUNNER_TEMP/secring.gpg" scripts/package.sh

      - name: Install the signed package over HTTP
        run: |
          python3 -m http.server -d dist 8000 &
          url="http://127.0.0.1:8000/$(basename dist/helm-git-*.tgz)"
          curl -fsS --retry 5 --retry-connrefused -o /dev/null "$url.prov"

          # A keyring without the signing key must be rejected.
          mkdir -m 700 "$RUNNER_TEMP/other"
          GNUPGHOME="$RUNNER_TEMP/other" gpg --batch --passphrase '' --quick-gen-key 'other <other@example.invalid>' rsa4096 sign never
          GNUPGHOME="$RUNNER_TEMP/other" gpg --batch --export > "$RUNNER_TEMP/other.gpg"
          if helm plugin install --keyring "$RUNNER_TEMP/other.gpg" "$url"; then
            echo "installed with an unrelated keyring" >&2
            exit 1
          fi

          helm plugin install --keyring "$RUNNER_TEMP/pubring.gpg" "$url"
          helm plugin list | grep '^helm-git'

  release:
    name: release
    needs: [lint, test, package]
    runs-on: ubuntu-latest
    if: |
      (!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')) &&
      github.event_name == 'push' && github.ref == 'refs/heads/master'
    concurrency:
      group: release-${{ github.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'

      - run: git fetch --unshallow --tags

      - run: npm ci

      - uses: azure/setup-helm@v4
        with:
          version: '4.3.2'

      - name: Write the signing key to a keyring
        env:
          HELM_GIT_SIGNING_PRIVATE_KEY: ${{ secrets.HELM_GIT_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$HELM_GIT_SIGNING_PRIVATE_KEY"
          printf '%s\n' "$HELM_GIT_SIGNING_PRIVATE_KEY" | gpg --batch --dearmor > "$RUNNER_TEMP/secring.gpg"

      - env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          HELM_GIT_SIGNING_KEY: ${{ vars.HELM_GIT_SIGNING_KEY }}
          HELM_GIT_SIGNING_KEYRING: ${{ runner.temp }}/secring.gpg
          HELM_GIT_SIGNING_PASSPHRASE: ${{ secrets.HELM_GIT_SIGNING_PASSPHRASE }}
        run: |
          npm run release
